plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// FastWorkbench 10.x for 26.1.2 dropped the `dev.shadowsoffire.fastbench.util.FastBenchUtil`
// utility class entirely (now mixes directly into vanilla AbstractCraftingMenu). Our legacy
// MixinFastBenchUtil target no longer exists; sources stay excluded until the integration is
// rewritten against the new mixin layout. REI now compiles (compileOnly above).
sourceSets.main.java {
    exclude 'com/illusivesoulworks/polymorph/common/integration/fastbench/**'
    exclude 'com/illusivesoulworks/polymorph/mixin/integration/fastbench/**'
}

// AccessTransformer auto-pickup (FML hardcodes this path).
def at = file('src/main/resources/META-INF/accesstransformer.cfg')
if (at.exists()) {
    neoForge.accessTransformers.from at
}

// Convenience copy of the built jar into a local staging folder. Opt-in: set jar_output_dir
// in gradle.properties or on the command line. Absent, the task simply does nothing, so the
// build works on a machine that is not the author's.
tasks.named('jar').configure {
    doLast {
        def outDir = project.findProperty('jar_output_dir')

        if (outDir) {
            copy {
                from archiveFile
                into file(outDir)
            }
        }
    }
}

dependencies {
    // JEI + REI compile references. No 26.x maven publication yet, so they come from the
    // folder local_mod_jars points at and are skipped when absent.
    def localJars = file(project.findProperty('local_mod_jars') ?: 'local-mod-jars')

    if (localJars.isDirectory()) {
        compileOnly fileTree(dir: localJars, include: ['jei-*.jar', 'RoughlyEnoughItems-*.jar'])
    }
    // EMI 26.x not yet published.
    // FastWorkbench 10.x removed FastBenchUtil entirely; legacy mixin target gone, integration deferred.
    // compileOnly "dev.emi:emi-neoforge:${emi_version}"
}
