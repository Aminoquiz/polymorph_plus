plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Integration sources for optional mods (FastBench, REI) that haven't published 1.21.11 jars
// yet. Compile-excluded until upstream ships; re-include when wiring those compileOnly deps.
sourceSets.main.java {
    // FastWorkbench 1.21.11 not yet published / legacy mixin target gone.
    exclude 'com/illusivesoulworks/polymorph/common/integration/fastbench/**'
    exclude 'com/illusivesoulworks/polymorph/mixin/integration/fastbench/**'
}

def at = file('src/main/resources/META-INF/accesstransformer.cfg')
if (at.exists()) {
    neoForge.accessTransformers.from at
}

// Convenience copy of the built jar into a local staging folder. Opt-in: set jar_output_dir
// in gradle.properties or on the command line. Absent, the task simply does nothing, so the
// build works on a machine that is not the author's.
tasks.named('jar').configure {
    doLast {
        def outDir = project.findProperty('jar_output_dir')

        if (outDir) {
            copy {
                from archiveFile
                into file(outDir)
            }
        }
    }
}

dependencies {
    // JEI + REI compile references. No maven publication for this line yet, so they come from
    // the folder local_mod_jars points at and are skipped when absent.
    def localJars = file(project.findProperty('local_mod_jars') ?: 'local-mod-jars')

    if (localJars.isDirectory()) {
        compileOnly fileTree(dir: localJars, include: ['jei-*.jar', 'RoughlyEnoughItems-*.jar'])
    }
    // EMI 1.21.11 / FastWorkbench 1.21.11 not yet wired.
    // compileOnly "dev.shadowsoffire:FastWorkbench:${fastworkbench_version}"
    // compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}"
}
