plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'com.modrinth.minotaur' version '2.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'net.darkhax.curseforgegradle' version '1.1.26'
}

archivesBaseName = "${mod_id}-forge"

mixin {
    add sourceSets.main, "polymorph.refmap.json"

    config "polymorph.mixins.json"
    config "polymorph-integrations.forge.mixins.json"
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_mc_version}-${parchment_version}-${minecraft_version}"
    
    if (project.hasProperty('forge_ats_enabled') && project.findProperty('forge_ats_enabled').toBoolean()) {
        // This location is hardcoded in Forge and can not be changed.
        // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
        project.logger.debug('Forge Access Transformers are enabled for this project.')
    }

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args "-mixin.config=polymorph.mixins.json"
            args "-mixin.config=polymorph-integrations.forge.mixins.json"
            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
			args "-mixin.config=polymorph.mixins.json"
            args "-mixin.config=polymorph-integrations.forge.mixins.json"
            mods {
                modServerRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args "-mixin.config=polymorph.mixins.json"
            args "-mixin.config=polymorph-integrations.forge.mixins.json"
            mods {
                modDataRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly project(":common")
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("curse.maven:fastworkbench-288885:${file_fastworkbench}")
    implementation fg.deobf("curse.maven:fastfurnace-299540:${file_fastfurnace}")
    implementation fg.deobf("curse.maven:placebo-283644:${file_placebo}")
}

// Forge 36 keeps MCP class names (only members take the official names), while common and
// Fabric use Mojang class names. The Forge compile reads a copy of common + forge sources
// with Mojang class names rewritten to MCP ones through mappings/mojang_to_mcp_classes.txt.
def remappedSrc = file("${buildDir}/remappedSrc")
def classMapFile = file('mappings/mojang_to_mcp_classes.txt')

task remapSources {
    def roots = [project(':common').file('src/main/java'), file('src/main/java')]
    inputs.files(roots.collect { fileTree(it) })
    inputs.file(classMapFile)
    outputs.dir(remappedSrc)
    doLast {
        Map<String, String> dotted = [:]
        Map<String, String> slashed = [:]
        classMapFile.eachLine { line ->
            def parts = line.trim().split(' ')
            if (parts.length == 2) {
                slashed[parts[0]] = parts[1]
                dotted[parts[0].replace('/', '.').replace('$', '.')] = parts[1].replace('/', '.').replace('$', '.')
            }
        }
        def simpleOf = { String n -> n.substring(n.lastIndexOf('.') + 1) }
        project.delete(remappedSrc)
        roots.each { root ->
            fileTree(root).include('**/*.java').each { File f ->
                String text = f.getText('UTF-8')
                Map<String, String> simple = [:]
                def importPat = ~/(?m)^import\s+(static\s+)?([\w.]+)\s*;/
                int headerEnd = 0
                def m = importPat.matcher(text)
                while (m.find()) {
                    headerEnd = m.end()
                }
                String header = text.substring(0, headerEnd)
                String body = text.substring(headerEnd)
                header = header.replaceAll(importPat) { List g ->
                    String st = g[1] ?: ''
                    String cls = g[2]
                    String rest = ''
                    while (cls.contains('.') && !dotted.containsKey(cls)) {
                        rest = cls.substring(cls.lastIndexOf('.')) + rest
                        cls = cls.substring(0, cls.lastIndexOf('.'))
                    }
                    if (!dotted.containsKey(cls)) {
                        return g[0]
                    }
                    if (!st && rest.isEmpty()) {
                        String mcp = dotted[cls]
                        simple[simpleOf(cls)] = simpleOf(mcp)
                        dotted.each { k, v ->
                            if (k.startsWith(cls + '.')) {
                                simple[simpleOf(cls) + k.substring(cls.length())] =
                                    simpleOf(mcp) + v.substring(mcp.length())
                            }
                        }
                    }
                    "import ${st}${dotted[cls]}${rest};"
                }
                body = body.replaceAll(~/\b(?:net\.minecraft|com\.mojang)(?:\.\w+)+/) { String all ->
                    String cls = all
                    String rest = ''
                    while (cls.contains('.') && !dotted.containsKey(cls)) {
                        rest = cls.substring(cls.lastIndexOf('.')) + rest
                        cls = cls.substring(0, cls.lastIndexOf('.'))
                    }
                    dotted.containsKey(cls) ? dotted[cls] + rest : all
                }
                body = body.replaceAll(java.util.regex.Pattern.compile('(?:net/minecraft|com/mojang)/[\\w/$]+')) { String all ->
                    slashed.getOrDefault(all, all)
                }
                if (!simple.isEmpty()) {
                    def keys = simple.keySet().sort { -it.length() }.collect { java.util.regex.Pattern.quote(it) }
                    def tokenPat = java.util.regex.Pattern.compile('(?<![\\w.])(' + keys.join('|') + ')(?!\\w)')
                    body = body.replaceAll(tokenPat) { List g -> simple[g[1]] }
                }
                File out = new File(remappedSrc, root.toPath().relativize(f.toPath()).toString())
                out.parentFile.mkdirs()
                out.setText(header + body, 'UTF-8')
            }
        }
    }
}

compileJava {
    dependsOn remapSources
    source = fileTree(remappedSrc)
}

javadoc {
    dependsOn remapSources
    source = fileTree(remappedSrc)
}

sourceSets {
    main {
        resources {
            srcDirs += '../licenses'
        }
    }
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta', '*.mixins.json']
def replaceProperties = [
        forge_version: forge_version, forge_version_range: forge_version_range, version: version,
        forge_mc_version_range: forge_mc_version_range, license: license, mod_id: mod_id, mod_author: mod_author,
        mod_description: mod_description, mod_name: mod_name, issue_tracker: issue_tracker, refmap_target: "polymorph."
]
processResources {
    from project(":common").sourceSets.main.resources
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar.finalizedBy('reobfJar')

jar {
    archiveClassifier.set("")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = findProperty('curseKey')
    def projectId = "${cf_forge_id}".toString()
    def mainFile = upload(projectId, file("${project.buildDir}/libs/${archivesBaseName}-${version}.jar"))
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = "${release_type}"
    "${release_versions}".split(',').each {
        mainFile.addGameVersion("${it}")
    }
    mainFile.withAdditionalFile(sourcesJar)
}

modrinth {
    token = findProperty('modrinthKey') ?: ''
    projectId = "${modrinth_id}"
    versionName = getArchivesBaseName() + "-" + getVersion()
    versionType = "${release_type}"
    uploadFile = file("${project.buildDir}/libs/${archivesBaseName}-${version}.jar")
    additionalFiles = [sourcesJar]
    gameVersions = "${release_versions}".split(",") as List<String>
}
