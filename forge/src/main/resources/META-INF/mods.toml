modLoader="javafml"
loaderVersion="[36,)"
license="${license}"
logoBlur=false
issueTrackerURL="${issue_tracker}"
logoFile="polymorph_icon.png"
[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
description='''
${mod_description}
'''
[[mods]]
modId="polymorph"
version="1.3.2"
displayName="Polymorph (alias)"
description='''
Compatibility alias provided by Polymorph+. Lets mods that depend on `polymorph` load against Polymorph+.

Do NOT install upstream Polymorph alongside Polymorph+. Pick one:
- Keep Polymorph+ (this mod) and REMOVE polymorph-*.jar from your mods folder.
- Or keep upstream Polymorph and REMOVE polymorph_plus-*.jar.

Both mods inject mixins on the same vanilla menus and cannot coexist.
'''
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${forge_mc_version_range}"
    ordering="NONE"
    side="BOTH"
