// Minimal NeoForge mod that ships ONE shaped crafting recipe with the diamond
// pickaxe pattern but outputs sticks. Loaded alongside Polymorph+ in dev/prod
// to surface a real conflict — without something like this, Polymorph+ has no
// UI to show on a vanilla crafting table.

plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

base {
    archivesName = 'conflict_tester-neoforge'
}

version = '1.0.0+26.2.0'
group = 'com.illusivesoulworks.polymorph.tester'

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            ideName = "ConflictTester ${it.name.capitalize()}"
        }
        client { client() }
    }

    mods {
        "conflict_tester" {
            sourceSet sourceSets.main
        }
    }
}

// Convenience copy of the built jar into a local staging folder. Opt-in: set jar_output_dir
// in gradle.properties or on the command line. Absent, the task simply does nothing, so the
// build works on a machine that is not the author's.
tasks.named('jar').configure {
    doLast {
        def outDir = project.findProperty('jar_output_dir')

        if (outDir) {
            copy {
                from archiveFile
                into file(outDir)
            }
        }
    }
}
